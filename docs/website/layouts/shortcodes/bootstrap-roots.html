{{- /* ReFS bootstrap chain + 13 roots. SVG with relURL hit-targets so links survive the /forefst/ sub-path.
       Structure targets: structures/*.md. */ -}}
<figure class="roots-figure">
<svg id="refsboot" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 652" style="width:100%;height:auto;max-width:920px;display:block;margin:0 auto" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    /* ── accent — change these two lines to match the site green ── */
    #refsboot .boxhi { fill: #e4efe6; stroke: #2f6b45; stroke-width: 1.6; }
    #refsboot .step  { font-size: 11.5px; font-weight: 700; fill: #2f6b45; }

    #refsboot .bg     { fill: #ffffff; }
    #refsboot .ttl    { font-size: 17px; font-weight: 700; fill: #16191c; }
    #refsboot .sub    { font-size: 12.5px; fill: #5c6469; }
    #refsboot .box    { fill: #f1f3f1; stroke: #333a40; stroke-width: 1.4; }
    #refsboot .grp    { fill: none; stroke: #c2cdc5; stroke-width: 1.2; stroke-dasharray: 5 4; }
    #refsboot .grplbl { font-size: 12.5px; font-weight: 700; fill: #3d454b; }
    #refsboot .grpsub { font-size: 11px; fill: #6b7379; }
    #refsboot .name   { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 13.5px; font-weight: 600; fill: #16191c; }
    #refsboot .where  { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 10.5px; fill: #5c6469; }
    #refsboot .kw     { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 9.5px; fill: #6b7379; }
    #refsboot .rname  { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 10px; fill: #16191c; }
    #refsboot .rnameb { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 10px; font-weight: 600; fill: #16191c; }
    #refsboot .ridx   { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 9px; fill: #7c848a; }
    #refsboot .arrow  { stroke: #5a6169; stroke-width: 1.5; fill: none; }
    #refsboot .arrowd { stroke: #98a0a6; stroke-width: 1.4; fill: none; stroke-dasharray: 4 3; }
    #refsboot .leg    { font-size: 11px; fill: #454c52; }
    #refsboot .note   { font-size: 11.5px; fill: #454c52; font-style: italic; }
    #refsboot .tiny   { font-size: 9.5px; fill: #8b9298; }
    #refsboot .hit { fill: transparent; cursor: pointer; }
    #refsboot .hit:hover { fill: rgba(47,107,69,0.12); }
  </style>

  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6169"/>
    </marker>
    <marker id="ahd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#98a0a6"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="920" height="652"/>

  <text class="ttl" x="45" y="38">ReFS bootstrap chain</text>
  <text class="sub" x="45" y="60">Every address on the volume is virtual. Nothing resolves until the Container Table is loaded, and it can only be reached</text>
  <text class="sub" x="45" y="77">through this fixed chain.</text>

  <rect class="box" x="65" y="102" width="175" height="58" rx="3"/>
  <text class="name" x="80" y="125">GPT</text>
  <text class="where" x="80" y="143">fixed at disk level</text>

  <path class="arrowd" d="M 246 131 L 264 131" marker-end="url(#ahd)"/>

  <rect class="box" x="270" y="102" width="175" height="58" rx="3"/>
  <text class="name" x="285" y="125">VBR</text>
  <text class="where" x="285" y="143">fixed at volume level</text>

  <path class="arrow" d="M 451 131 L 469 131" marker-end="url(#ah)"/>

  <rect class="box" x="475" y="102" width="175" height="58" rx="3"/>
  <text class="name" x="490" y="125">SUPB</text>
  <text class="where" x="490" y="143">LCN 0x1E + 2 backups</text>

  <path class="arrow" d="M 656 131 L 674 131" marker-end="url(#ah)"/>

  <rect class="box" x="680" y="102" width="175" height="58" rx="3"/>
  <text class="name" x="695" y="125">CHKP</text>
  <text class="where" x="695" y="143">2 copies, newest wins</text>

  <!-- ① CHKP → root #7, entering from the right -->
  <path class="arrow" d="M 845 162 L 845 353 L 833 353" marker-end="url(#ah)"/>
  <text class="step" x="828" y="212" text-anchor="end">enter at the Container Table</text>
  <text class="leg" x="828" y="227" text-anchor="end">the only structure that can translate an address</text>

  <!-- ══ the 13 root tables ══ -->
  <rect class="grp" x="45" y="240" width="830" height="268" rx="4"/>
  <text class="grplbl" x="62" y="262">The 13 root tables</text>
  <text class="grpsub" x="192" y="262">the checkpoint hands over all thirteen — but only three of them can be read immediately</text>

  <rect class="box" x="89" y="274" width="172" height="42" rx="3"/>
  <text class="ridx" x="100" y="291">#0</text>
  <text class="rnameb" x="100" y="307">Object ID Table</text>

  <rect class="box" x="279" y="274" width="172" height="42" rx="3"/>
  <text class="ridx" x="290" y="291">#1</text>
  <text class="rname" x="290" y="307">Medium Allocator</text>

  <rect class="box" x="469" y="274" width="172" height="42" rx="3"/>
  <text class="ridx" x="480" y="291">#2</text>
  <text class="rname" x="480" y="307">Container Allocator</text>

  <rect class="box" x="659" y="274" width="172" height="42" rx="3"/>
  <text class="ridx" x="670" y="291">#3</text>
  <text class="rname" x="670" y="307">Schema Table</text>

  <rect class="box" x="89" y="332" width="172" height="42" rx="3"/>
  <text class="ridx" x="100" y="349">#4</text>
  <text class="rname" x="100" y="365">Parent-Child Table</text>

  <rect class="box" x="279" y="332" width="172" height="42" rx="3"/>
  <text class="ridx" x="290" y="349">#5</text>
  <text class="rname" x="290" y="365">Object ID (dup)</text>

  <rect class="box" x="469" y="332" width="172" height="42" rx="3"/>
  <text class="ridx" x="480" y="349">#6</text>
  <text class="rname" x="480" y="365">Block Refcount</text>

  <rect class="boxhi" x="659" y="332" width="172" height="42" rx="3"/>
  <text class="ridx" x="670" y="349">#7</text>
  <text class="rnameb" x="670" y="365">Container Table</text>

  <rect class="boxhi" x="89" y="390" width="172" height="42" rx="3"/>
  <text class="ridx" x="100" y="407">#8</text>
  <text class="rname" x="100" y="423">Container Table (dup)</text>

  <rect class="box" x="279" y="390" width="172" height="42" rx="3"/>
  <text class="ridx" x="290" y="407">#9</text>
  <text class="rname" x="290" y="423">Schema Table (dup)</text>

  <rect class="box" x="469" y="390" width="172" height="42" rx="3"/>
  <text class="ridx" x="480" y="407">#10</text>
  <text class="rname" x="480" y="423">Container Index</text>

  <rect class="box" x="659" y="390" width="172" height="42" rx="3"/>
  <text class="ridx" x="670" y="407">#11</text>
  <text class="rname" x="670" y="423">Integrity State</text>

  <rect class="boxhi" x="89" y="448" width="172" height="42" rx="3"/>
  <text class="ridx" x="100" y="465">#12</text>
  <text class="rname" x="100" y="481">Small Allocator</text>

  <!-- legend -->
  <rect class="boxhi" x="530" y="452" width="22" height="14" rx="2"/>
  <text class="leg" x="562" y="463">real cluster number: read directly</text>
  <rect class="box" x="530" y="474" width="22" height="14" rx="2"/>
  <text class="leg" x="562" y="485">virtual cluster address: needs the Container Table first</text>

  <!-- ② Object ID Table → trees -->
  <path class="arrow" d="M 89 295 L 25 295 L 25 536 L 460 536 L 460 554" marker-end="url(#ah)"/>
  <text class="step" x="60" y="525">each object is mapped to its own tree via the Object ID Table</text>

  <rect class="box" x="225" y="558" width="470" height="56" rx="3"/>
  <text class="name" x="245" y="581">B+-trees — objects, directories, attributes</text>
  <text class="where" x="245" y="599">rows decoded against the Schema Table — only now can a file be named</text>

  <text class="note" x="45" y="640">Each link is version-dependent: page-reference size, checkpoint layout and root-list mode all changed between ReFS 3.4 and 3.14.</text>

  <!-- clickable overlays (base-path-safe via relURL) -->
  <a xlink:href="{{ "structures/vbr/" | relURL }}" href="{{ "structures/vbr/" | relURL }}"><title>VBR</title><rect class="hit" x="270" y="102" width="175" height="58" rx="3"/></a>
  <a xlink:href="{{ "structures/supb/" | relURL }}" href="{{ "structures/supb/" | relURL }}"><title>Superblock</title><rect class="hit" x="475" y="102" width="175" height="58" rx="3"/></a>
  <a xlink:href="{{ "structures/chkp/" | relURL }}" href="{{ "structures/chkp/" | relURL }}"><title>Checkpoint</title><rect class="hit" x="680" y="102" width="175" height="58" rx="3"/></a>
  <a xlink:href="{{ "structures/object_table/" | relURL }}" href="{{ "structures/object_table/" | relURL }}"><title>Object ID Table</title><rect class="hit" x="89" y="274" width="172" height="42" rx="3"/></a>
  <a xlink:href="{{ "structures/allocators/" | relURL }}" href="{{ "structures/allocators/" | relURL }}"><title>Medium Allocator</title><rect class="hit" x="279" y="274" width="172" height="42" rx="3"/></a>
  <a xlink:href="{{ "structures/allocators/" | relURL }}" href="{{ "structures/allocators/" | relURL }}"><title>Container Allocator</title><rect class="hit" x="469" y="274" width="172" height="42" rx="3"/></a>
  <a xlink:href="{{ "structures/schema_table/" | relURL }}" href="{{ "structures/schema_table/" | relURL }}"><title>Schema Table</title><rect class="hit" x="659" y="274" width="172" height="42" rx="3"/></a>
  <a xlink:href="{{ "structures/parent_child_table/" | relURL }}" href="{{ "structures/parent_child_table/" | relURL }}"><title>Parent-Child Table</title><rect class="hit" x="89" y="332" width="172" height="42" rx="3"/></a>
  <a xlink:href="{{ "structures/object_table/" | relURL }}" href="{{ "structures/object_table/" | relURL }}"><title>Object ID (dup)</title><rect class="hit" x="279" y="332" width="172" height="42" rx="3"/></a>
  <a xlink:href="{{ "structures/block_refcount/" | relURL }}" href="{{ "structures/block_refcount/" | relURL }}"><title>Block Refcount</title><rect class="hit" x="469" y="332" width="172" height="42" rx="3"/></a>
  <a xlink:href="{{ "structures/container_table/" | relURL }}" href="{{ "structures/container_table/" | relURL }}"><title>Container Table</title><rect class="hit" x="659" y="332" width="172" height="42" rx="3"/></a>
  <a xlink:href="{{ "structures/container_table/" | relURL }}" href="{{ "structures/container_table/" | relURL }}"><title>Container Table (dup)</title><rect class="hit" x="89" y="390" width="172" height="42" rx="3"/></a>
  <a xlink:href="{{ "structures/schema_table/" | relURL }}" href="{{ "structures/schema_table/" | relURL }}"><title>Schema Table (dup)</title><rect class="hit" x="279" y="390" width="172" height="42" rx="3"/></a>
  <a xlink:href="{{ "structures/container_index/" | relURL }}" href="{{ "structures/container_index/" | relURL }}"><title>Container Index</title><rect class="hit" x="469" y="390" width="172" height="42" rx="3"/></a>
  <a xlink:href="{{ "structures/integrity_state/" | relURL }}" href="{{ "structures/integrity_state/" | relURL }}"><title>Integrity State</title><rect class="hit" x="659" y="390" width="172" height="42" rx="3"/></a>
  <a xlink:href="{{ "structures/allocators/" | relURL }}" href="{{ "structures/allocators/" | relURL }}"><title>Small Allocator</title><rect class="hit" x="89" y="448" width="172" height="42" rx="3"/></a>
</svg>

  <figcaption>Click any box to open its structure page. Full walkthrough: <a href="{{ "concepts/bootstrap_chain/" | relURL }}">Bootstrap Chain</a> &middot; per-table detail on each <a href="{{ "structures/" | relURL }}">structure page</a>.</figcaption>
</figure>

{{- /* expects a slice of pages */ -}}
<div class="index-list">
  {{- range . -}}
    {{- if eq .Kind "page" -}}
    <div class="index-item">
      <a class="ii-name" href="{{ .RelPermalink }}">{{ .Title }}</a>
      <p class="ii-desc">{{ with .Description }}{{ . }}{{ else }}{{ .Summary | plainify | truncate 200 }}{{ end }}</p>
    </div>
    {{- end -}}
  {{- end -}}
</div>

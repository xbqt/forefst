[pytest]
# NOTE: `timeout`/`timeout_method` need the optional pytest-timeout plugin. They were set here
# unconditionally, so a clone without the plugin got `PytestConfigWarning: Unknown config option:
# timeout` on every run -- a warning about the harness, in a suite whose job is to be trusted.
# The suite has no dependencies; pass the timeout on the command line when you want one:
#     python3 -m pytest analysis/tests -q --timeout=60      (requires pytest-timeout)
